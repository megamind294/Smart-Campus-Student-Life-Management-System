name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:hostinger
      - name: Package Hostinger upload
        run: |
          mkdir -p hostinger-package/Smart-Campus-Student-Life-Management-System
          cp -a dist/. hostinger-package/Smart-Campus-Student-Life-Management-System/
          cd hostinger-package
          zip -r ../Smart-Campus-Hostinger.zip Smart-Campus-Student-Life-Management-System
      - uses: actions/upload-artifact@v4
        with:
          name: hostinger-build
          path: Smart-Campus-Hostinger.zip
